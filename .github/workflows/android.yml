# 工作流名称
name: Android CI

# 触发条件：推送到 main 分支或向 main 分支发起 PR 时触发
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 校验 gradle-wrapper.jar 未被篡改（供应链安全）
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    # JDK 25（最新 LTS，与本地开发环境一致；Gradle 9.6+ 支持）
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 官方 Gradle action：依赖缓存 + 构建缓存 + 构建报告
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run lint check
      run: ./gradlew lintDebug

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest

    - name: Build debug APK
      run: ./gradlew assembleDebug

    # 测试与 lint 报告：失败时也上传，便于排查
    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reports
        path: |
          app/build/reports/tests/testDebugUnitTest
          app/build/reports/lint-results-debug.html
        if-no-files-found: ignore

    # Debug APK 产物（debug 签名，由 CI 临时生成的 debug key 签署，非官方发布签名）
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
